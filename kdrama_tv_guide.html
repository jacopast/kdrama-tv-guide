<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Drama US Streaming TV Guide | 미국 K-드라마 주간 편성표</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Courier+Prime:wght@400;700&display=swap');

        /* 타이핑된 듯한 미니멀 모노크롬. 3단 명도: 배경(회색) < 일반 에피소드 박스(옅은 회색) < 내가 찜한 것(흰색). */
        :root {
            --bg-color: #e8e7e2;
            --text-color: #1c1c1a;
            --text-soft: rgba(28, 28, 26, 0.55);
            --border-color: rgba(28, 28, 26, 0.35);
            --border-strong: #1c1c1a;
            --cell-bg: #f2f1ec;
            --cell-bg-starred: #ffffff;
            --header-bg: transparent;
            --sticky-bg: transparent;
            --btn-bg: transparent;
            --btn-text: #1c1c1a;
            --link-color: #1c1c1a;
            --today-bg: rgba(28, 28, 26, 0.14);
            --today-border: #1c1c1a;
            --font-main: 'Nanum Gothic Coding', 'Courier Prime', monospace;
            --font-heading: 'Nanum Gothic Coding', 'Courier Prime', monospace;
            --font-mono: 'Courier Prime', 'Nanum Gothic Coding', monospace;
            --shadow: none;
            --transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        * {
            box-sizing: border-box;
            transition: var(--transition);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 16px;
            font-size: 14px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* 제목/날짜뱃지/시계는 폭이 줄어들면 브레이크포인트 하나에 툭 걸리는 대신,
           각자 gap만큼 여유가 없어지는 순간 자연스럽게 자기 줄로 내려가도록 flex-wrap을 쓴다. */
        h1 {
            font-family: var(--font-heading);
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 18px;
            font-size: clamp(1.05rem, 3vw, 1.55rem);
            letter-spacing: 0.03em;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 10px;
        }

        h1 > div {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 2px 8px;
            min-width: 0;
        }

        .site-title {
            cursor: pointer;
        }
        .site-title:hover {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .week-badge-text {
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            color: var(--text-soft);
            font-family: var(--font-mono);
            font-weight: normal;
        }

        .live-clock-badge {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: normal;
            color: var(--text-soft);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .controls {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .controls button {
            background: none;
            color: var(--text-soft);
            border: none;
            padding: 2px 0;
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 0.85rem;
            letter-spacing: 0.02em;
        }

        .controls button:hover {
            color: var(--text-color);
        }

        .controls button.active {
            color: var(--text-color);
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .controls button:disabled {
            opacity: 0.25;
            cursor: default;
        }

        .week-label {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-color);
            min-width: 150px;
            text-align: center;
        }

        .week-today-link {
            font-size: 0.75rem !important;
            color: var(--text-soft) !important;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* TV Guide Grid */
        .grid-container {
            position: relative;
            overflow-x: auto;
            border: none;
            background-color: var(--bg-color);
            border-radius: 0;
            margin-bottom: 20px;
        }

        /* 오늘 칸: 헤더-첫 행 사이는 원래 간격을 두고, 그 아래 채널 행 사이 간격은 이 칠(fill)이
           표 뒤에 깔려서 끊기지 않고 하나로 이어져 보이게 한다. */
        #todayColFill {
            position: absolute;
            background-color: var(--today-bg);
            z-index: 0;
            pointer-events: none;
        }

        #guideTable {
            position: relative;
            z-index: 1;
        }

        /* 선을 긋는 대신 셀 사이 여백(회색 배경이 비치는 틈)만으로 구분한다 — 박스(흰 칸) 자체가 경계가 된다 */
        /* 데스크톱 폭 안에서도 창을 좁히면 칸 사이 간격/여백이 하드 브레이크포인트 없이 같이 줄어들도록 clamp()를 쓴다. */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: clamp(1px, 0.4vw, 3px);
            min-width: 700px;
            table-layout: fixed;
        }

        th, td {
            border: none;
            padding: clamp(5px, 1.2vw, 10px) clamp(4px, 1vw, 8px);
            vertical-align: top;
        }

        /* 칸 자체는 배경색(페이지와 동일) — 박스는 실제 작품이 있는 카드에만 생긴다. 빈 칸("-")은 박스 없이 배경에 묻힌다. */

        th {
            background-color: transparent;
            position: sticky;
            top: 0;
            z-index: 10;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
        }

        th.channel-th {
            width: clamp(64px, 8vw, 92px);
            left: 0;
            z-index: 20;
            background-color: var(--bg-color);
            text-align: left;
        }

        th.batch-th {
            width: clamp(110px, 14vw, 180px);
            font-style: italic;
        }

        /* Sticky First Column for Channels */
        td:first-child {
            position: sticky;
            left: 0;
            background-color: var(--bg-color);
            z-index: 5;
            font-family: var(--font-mono);
            font-weight: bold;
            text-align: left;
            vertical-align: middle;
            padding: 10px 6px;
        }

        .ch-logo {
            display: block;
            padding: 0;
            border-radius: 0;
            color: var(--text-soft);
            background: transparent;
            font-size: 0.72rem;
            margin-top: 2px;
            font-weight: 400;
            letter-spacing: 0.03em;
            border: none;
        }

        /* Today Highlight — 헤더뿐 아니라 그 요일 칸 전체(위아래)를 진하게 물들인다.
           카드 자체의 흰색/옅은 회색 박스 색은 그대로 유지되고, 칸의 여백(gutter) 부분만 진해진다. */
        th.today-col,
        td.today-col {
            background-color: var(--today-bg);
        }

        .today-badge {
            display: inline-block;
            font-size: 0.68rem;
            background: transparent;
            color: var(--text-color);
            padding: 0;
            margin-left: 4px;
            vertical-align: middle;
        }

        /* Month View — 좁은 화면(기본)은 빈 날짜를 건너뛰는 세로 목록, 넓은 화면은 아래 달력 격자로 전환 */
        #monthList {
            max-width: 480px;
        }
        .month-calendar { display: none; }

        .month-day-group {
            margin-bottom: 16px;
        }

        .month-day-label {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-soft);
            margin-bottom: 6px;
        }

        .month-empty-state {
            color: var(--text-soft);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            padding: 20px 0;
        }

        /* 넓은 화면: 전통적인 달력 격자로 한 달을 한눈에 */
        @media (min-width: 900px) {
            #monthList { display: none; }
            .month-calendar {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 4px;
            }
            .cal-weekday {
                font-family: var(--font-mono);
                font-weight: 700;
                font-size: 0.75rem;
                color: var(--text-soft);
                text-align: center;
                padding: 4px 0;
            }
            .cal-cell {
                min-height: 100px;
                padding: 5px 6px;
                background-color: transparent;
            }
            .cal-cell.cal-blank { background: none; }
            .cal-cell.cal-today { background-color: var(--today-bg); }
            .cal-daynum {
                font-family: var(--font-mono);
                font-size: 0.75rem;
                color: var(--text-soft);
                margin-bottom: 3px;
            }
            .cal-cell.cal-today .cal-daynum {
                color: var(--text-color);
                font-weight: 700;
            }
            .cal-entries .drama-card {
                padding: 3px 4px;
                margin-bottom: 3px;
                gap: 0;
            }
            .cal-entries .drama-title-link {
                font-size: 0.68rem;
                line-height: 1.2;
            }
            .cal-entries .ep-tag {
                font-size: 0.6rem;
            }
            .cal-entries .card-actions { display: none; }
        }

        /* Empty Cell */
        .empty-cell {
            text-align: center;
            color: var(--text-soft);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding-top: 15px;
        }

        /* 채널은 (isChannelActive로) 전체적으로는 활성이어도, 하필 지금 보는 그 주엔 걸린 게 하나도
           없을 수 있다(예: 이 주엔 미국·한국 겸용 채널이 먼저 채가서 이 채널 칸이 전부 비는 경우).
           그런 주엔 그 채널 행 자체를 접는다 — 예전엔 모바일 폭에서만 이렇게 접혔는데, 데스크탑에서도
           똑같이 다 "-"인 행이 계속 남아있던 걸 이제 다 같이 접는다. */
        tr.row-empty { display: none; }

        /* Drama Card inside grid cell — 박스 없이 여백과 굵기 대비로만 구획한다 */
        /* td 자체가 흰 박스이므로 카드는 배경 없이 내용만 담는다. 한 칸에 여러 작품이 있으면 여백으로만 구분한다. */
        /* 카드 자체가 박스: 평소엔 옅은 회색, 내가 찜한 작품만 흰색으로 도드라진다 */
        .drama-card {
            background-color: var(--cell-bg);
            border: none;
            border-radius: 0;
            padding: 7px 8px;
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .drama-card.starred {
            background-color: var(--cell-bg-starred);
        }

        /* 정확한 날짜가 아직 안 나온 "(미정)" 임시 배치 항목: 박스 배경을 페이지 배경과 똑같이 만들어
           박스 자체가 없는 것처럼 흐리게 가라앉히고, 글자도 옅은 회색으로 톤 다운해서 확정된 편성과
           한눈에 구분되게 한다. */
        .drama-card.tentative {
            background-color: var(--bg-color);
        }

        .drama-card.tentative .drama-title-link,
        .drama-card.tentative .ep-tag {
            color: var(--text-soft);
        }

        .drama-card:last-child {
            margin-bottom: 0;
        }

        .drama-card-footer {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .drama-title-link {
            font-family: var(--font-heading);
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--link-color);
            text-decoration: none;
            cursor: pointer;
            line-height: 1.3;
            word-break: keep-all;
            display: inline-block;
        }

        .drama-title-link:hover,
        .drama-title-link:focus-visible {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .drama-title-link:focus-visible {
            outline: 1px solid var(--border-strong);
            outline-offset: 2px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-size: 0.72rem;
            font-family: var(--font-mono);
            color: var(--text-soft);
            opacity: 1;
            line-height: 1;
        }

        .btn-icon:hover {
            color: var(--text-color);
        }

        .btn-star {
            font-size: 0.8rem !important;
        }

        .btn-star.empty {
            opacity: 0.4;
        }

        .ep-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: normal;
            font-family: var(--font-mono);
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text-soft);
            /* 채널 여러 개가 겹쳐 붙는 함께 모드에서는 라벨이 길어지므로, 한 줄 고정 대신 줄바꿈해서
               카드 밖으로 삐져나가거나 옆 칸과 겹치지 않게 한다. */
            white-space: normal;
            overflow-wrap: anywhere;
            min-width: 0;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-color);
            border: 1px solid var(--border-strong);
            border-radius: 0;
            max-width: 580px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            display: flex;
            gap: 16px;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 14px;
            background: transparent;
            color: var(--text-soft);
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            width: auto;
            height: auto;
            line-height: 1;
            text-align: center;
            font-weight: normal;
        }

        .modal-close:hover {
            color: var(--text-color);
        }

        .modal-close:hover {
            border-color: var(--border-strong);
        }

        .modal-poster {
            width: 140px;
            flex-shrink: 0;
        }

        .modal-poster img {
            width: 100%;
            border-radius: 0;
            border: 1px solid var(--border-color);
            object-fit: cover;
            filter: grayscale(1) contrast(1.05);
        }

        .modal-poster.is-missing {
            display: none;
        }

        .modal-info {
            flex-grow: 1;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .modal-info h2 {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 2px;
        }

        .modal-star-btn {
            background-color: transparent;
            color: var(--btn-text);
            border: none;
            padding: 0;
            border-radius: 0;
            cursor: pointer;
            margin-top: 14px;
            font-family: var(--font-heading);
            font-weight: bold;
            font-size: 0.9rem;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .modal-star-btn:hover {
            opacity: 0.7;
        }

        .site-footer {
            margin-top: 32px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-soft);
        }

        .site-footer a {
            color: var(--text-soft);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .site-footer a:hover {
            color: var(--text-color);
        }

        .site-footer-sep {
            margin: 0 8px;
        }

        @media print {
            .site-footer { display: none !important; }
            .toolbar, .modal-overlay { display: none !important; }
            body { background: white; color: black; }
            .grid-container { box-shadow: none; border: none; }
            th, td { border: 1px solid #ccc; }
        }

        @media (max-width: 768px) {
            .modal-content { flex-direction: column; }
            .modal-poster { width: 100px; margin: 0 auto; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .controls { display: flex; flex-wrap: wrap; gap: 5px; }
            .controls button { flex: 1; margin: 0; }

            /* 제목/날짜 배지가 좁은 화면에서 어중간하게 줄바꿈되지 않도록 아예 세로로 쌓는다 */
            h1 { flex-direction: column; align-items: flex-start; gap: 2px; }
            h1 > div { display: flex; flex-direction: column; gap: 2px; }
            .site-title { font-size: 1.05rem; line-height: 1.3; }
            .week-badge-text { margin-left: 0; font-size: 0.75rem; }
            .live-clock-badge { font-size: 0.7rem; }

            /* 모바일에서는 가로로 넓은 표 대신, 채널별로 세로 목록이 되도록 표를 통째로 재배치한다.
               내용 없는 요일 칸은 아예 숨겨서 그 채널이 실제로 방영하는 날짜만 보이게 한다. */
            .grid-container { overflow-x: visible; }
            table { min-width: 0; border-spacing: 0 10px; }
            thead { display: none; }
            tr { display: block; }
            td { display: block; width: auto !important; position: static !important; }

            td:first-child {
                padding: 4px 2px;
                font-size: 0.95rem;
            }
            .ch-logo { display: inline; margin-left: 6px; }

            td:not(:first-child) {
                padding: 8px 10px;
                margin-bottom: 2px;
            }
            td:not(:first-child).empty-cell { display: none; }
            td:not(:first-child)::before {
                content: attr(data-label);
                display: block;
                font-size: 0.7rem;
                font-weight: 700;
                color: var(--text-soft);
                margin-bottom: 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        <div>
            <span class="site-title" role="button" tabindex="0" onclick="goHome()" onkeydown="if(event.key==='Enter')goHome()" title="이번 주로 돌아가기">K-DRAMA US STREAMING TV GUIDE</span>
            <span class="week-badge-text" id="weekBadge">[기준 주차 계산 중...]</span>
        </div>
        <span class="live-clock-badge" id="liveClock">KST --:--:-- · ET --:--:--</span>
    </h1>

    <div class="toolbar">
        <div class="controls" id="regionToggle">
            <button id="btnRegionUS" class="active">🇺🇸 미국</button>
            <button id="btnRegionKR">🇰🇷 한국</button>
            <button id="btnRegionAll">🌐 함께</button>
        </div>
        <div class="controls" id="viewToggle">
            <button id="btnViewWeek" class="active">주간</button>
            <button id="btnViewMonth">월간</button>
        </div>
        <div class="controls" id="weekToggle">
            <button id="btnWeekPrev" title="이전 주">◀</button>
            <span class="week-label" id="weekLabel">이번 주</span>
            <button id="btnWeekNext" title="다음 주">▶</button>
            <button id="btnWeekToday" class="week-today-link" style="display:none;">오늘로</button>
        </div>
        <div class="controls" id="monthToggle" style="display:none;">
            <button id="btnMonthPrev" title="이전 달">◀</button>
            <span class="week-label" id="monthLabel">이번 달</span>
            <button id="btnMonthNext" title="다음 달">▶</button>
            <button id="btnMonthToday" class="week-today-link" style="display:none;">오늘로</button>
        </div>
        <div class="controls">
            <button id="btnWatchlist" aria-pressed="false">내 리스트만 보기</button>
        </div>
    </div>

    <div class="grid-container" id="weekView">
        <table id="guideTable">
            <thead>
                <tr>

const DAY_ORDER = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAY_KR = { Mon: "월", Tue: "화", Wed: "수", Thu: "목", Fri: "금", Sat: "토", Sun: "일" };
const COLUMNS = [...DAY_ORDER, "Batch"];

let currentWeekOffset = 0; // 0 = 이번 주. 음수 = 지난 주들, 양수 = 다음 주들.

const WEEK_OFFSET_MAX = 4;  // 최대 한 달 후

const MONTH_OFFSET_MAX = 3;

// '오늘'/'이번 주' 기준 시간대.
// 미국(US) 모드이거나 미국 위치에 있을 경우 미국 동부시간(America/New_York) 또는 현지 브라우저 미국 시간대를 기준으로,
// 한국(KR) 모드일 경우 한국 표준시(Asia/Seoul)를 기준으로 '오늘'과 날짜를 계산한다.
function getEffectiveTimeZone() {
    if (regionMode === 'KR') {
        return "Asia/Seoul";
    }
    const localTz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'America/New_York';
    if (localTz.startsWith('America/') || localTz.startsWith('US/')) {
        return localTz;
    }
    return "America/New_York";
}

function getTodayDayName() {
    const tz = getEffectiveTimeZone();
    return new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short' }).format(new Date());
}

function getTodayDate() {
    const tz = getEffectiveTimeZone();
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const map = {};
    parts.forEach(p => map[p.type] = p.value);
    return new Date(`${map.year}-${map.month}-${map.day}T12:00:00`); // noon avoids DST edge issues
}

function toISODate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getTodayISO() {
    return toISODate(getTodayDate());
}

let todayStr = getTodayDayName();
let todayISO = getTodayISO();

function syncTodayState() {
    todayStr = getTodayDayName();
    todayISO = getTodayISO();
}

function getUSEasternDay() { return getTodayDayName(); }
function getUSEasternDate() { return getTodayDate(); }

function getWeekMonday(offset) {
    const today = getUSEasternDate();
    const jsWeekday = today.getDay(); // 0=Sun..6=Sat
    const mondayOffset = jsWeekday === 0 ? -6 : 1 - jsWeekday;
    const monday = new Date(today);
    monday.setDate(today.getDate() + mondayOffset + offset * 7);
    return monday;
}
// 선택된 주(offset)의 월~일 7일치 {key, dateISO, label} 배열을 계산한다.
function getWeekDates(offset) {
    const monday = getWeekMonday(offset);
    syncTodayState();
    return DAY_ORDER.map((key, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateISO = toISODate(d);
        let label = `${DAY_KR[key]} (${d.getMonth() + 1}/${d.getDate()})`;
        return { key, dateISO, label, isToday: dateISO === todayISO };
    });
}
function getWeekSundayISO(offset) {
    const dates = getWeekDates(offset);
    return dates[dates.length - 1].dateISO;
}

// 전편 공개(batch) 작품이 편성표에 노출되는 [공개일, 종료일) 구간을 ISO 날짜 문자열로 계산한다.
// 12부작이면 6주(회차/2), 즉 주 2회 편성이었다면 걸렸을 기간만큼만 "지금 볼만한 신작"으로 보여준다.
function getBatchWindow(drama) {
    const epMatch = (drama.episodes || "").match(/\d+/);
    const epCount = epMatch ? parseInt(epMatch[0], 10) : 2;
    const visibleWeeks = Math.max(1, Math.ceil(epCount / 2));
    const release = new Date(`${drama.releaseDate}T12:00:00`);
    const end = new Date(release);
    end.setDate(end.getDate() + visibleWeeks * 7);
    return { releaseISO: drama.releaseDate, endISO: toISODate(end) };
}

// 한 작품이 플랫폼마다 다른 날짜에 풀리는 경우(예: TVING이 tvN 본방보다 나흘 먼저 선공개)를 위해,
// 특정 플랫폼 객체가 자체 schedule/releaseDate/batchEp/isBatch를 갖고 있으면 그걸 우선 쓰고,
// 없으면 작품 전체의 기본값(대부분의 사이멀캐스트 작품이 공유하는 값)을 쓴다.
function effectiveForChannel(drama, platform) {
    return {
        isBatch: platform.isBatch !== undefined ? platform.isBatch : drama.isBatch,
        releaseDate: platform.releaseDate || drama.releaseDate,
        batchEp: platform.batchEp || drama.batchEp,
        schedule: platform.schedule || drama.schedule
    };
}

// 이 작품이 주어진 날짜(요일 칸 dateISO, 또는 'Batch' 열이면 null)에 실제로 걸리는 플랫폼들을 찾는다.
// day==='Batch'일 땐 weekMondayISO 기준으로 배치 노출 기간 안에 있는 플랫폼을 찾는다.
function platformsActiveOn(drama, day, dateISO, weekMondayISO) {
    return drama.platforms.filter(p => {
        const eff = effectiveForChannel(drama, p);
        if (day === 'Batch') {
            if (!eff.isBatch || !eff.releaseDate) return false;
            const { releaseISO, endISO } = getBatchWindow({ ...drama, releaseDate: eff.releaseDate });
            return releaseISO < weekMondayISO && weekMondayISO < endISO;
        }
        if (eff.isBatch) return eff.releaseDate === dateISO;
        return eff.schedule && Object.prototype.hasOwnProperty.call(eff.schedule, dateISO);
    });
}

// 선택된 달(offset)의 정보를 계산한다: 연/월, 1일~말일 ISO 날짜, 그리고 표시용 라벨.
const MONTH_KR_LABEL = { '-1': '지난 달', '0': '이번 달', '1': '다음 달' };
function getMonthInfo(offset) {
    const today = getUSEasternDate();
    const first = new Date(today.getFullYear(), today.getMonth() + offset, 1, 12);
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0, 12);
    const daysInMonth = last.getDate();
    const wordLabel = MONTH_KR_LABEL[String(offset)] || (offset < 0 ? `${-offset}달 전` : `${offset}달 후`);
    return {
        year: first.getFullYear(),
        month: first.getMonth() + 1, // 1~12
        firstISO: toISODate(first),
        lastISO: toISODate(last),
        daysInMonth,
        label: `${wordLabel} (${first.getFullYear()}년 ${first.getMonth() + 1}월)`
    };
}

function updateDateHeaders(offset) {
    const weekDates = getWeekDates(offset);
    weekDates.forEach(({ key, label }) => {
        const th = document.querySelector(`th[data-day="${key}"]`);
        if (th) th.textContent = label;
    });
}

// Live Clock — 편성 날짜는 한국 방송일(KST)을 유지하되, 현재 시각은 두 지역을 함께 보여준다.
function formatZonedTime(timeZone) {
    return new Intl.DateTimeFormat('en-US', {
        timeZone,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
    }).format(new Date());
}

function updateLiveClock() {
    const kst = formatZonedTime("Asia/Seoul");
    const et = formatZonedTime("America/New_York");
    const el = document.getElementById('liveClock');
    if (!el) return;
    const primary = regionMode === 'US' ? `ET ${et} · KST ${kst}` : `KST ${kst} · ET ${et}`;
    el.textContent = primary;
    el.title = regionMode === 'KR'
        ? '편성 날짜 및 오늘 기준: 한국 표준시(KST)'
        : '편성 날짜 및 오늘 기준: 미국 동부시간(ET)';
}

// 헤더의 "[n월 n주차: m/d ~ m/d 주간 본방]" 배지 — 하드코딩 대신 오늘 날짜 기준(이번 주)으로 항상 계산한다.
function updateWeekBadge() {
    const el = document.getElementById('weekBadge');
    if (!el) return;
    const thisWeek = getWeekDates(0);
    const monday = thisWeek[0], sunday = thisWeek[6];
    const [my, mm, md] = monday.dateISO.split('-').map(Number);
    const weekOfMonth = Math.ceil(md / 7);
    const [, sm, sd] = sunday.dateISO.split('-').map(Number);
    el.textContent = `[${my}년 ${mm}월 ${weekOfMonth}주차: ${mm}/${md} ~ ${sm}/${sd} 주간 본방]`;
}

// 이번 주 / 다음 주 전환 시 헤더 날짜·오늘 하이라이트·그리드를 한 번에 다시 그린다.
function renderWeek() {
    updateDateHeaders(currentWeekOffset);
    highlightToday();
    renderGrid();
    paintTodayColumnFill();

    // 주 라벨: 이번 주/지난 주/다음 주는 말로, 그 이상은 "N주 전/후"로 + 실제 날짜 범위를 항상 같이 보여준다.
    const weekDates = getWeekDates(currentWeekOffset);
    const isoToMD = iso => { const [, m, d] = iso.split('-'); return `${parseInt(m,10)}/${parseInt(d,10)}`; };
    const rangeStr = `(${isoToMD(weekDates[0].dateISO)}~${isoToMD(weekDates[6].dateISO)})`;
    let weekWord;
    if (currentWeekOffset === 0) weekWord = '이번 주';
    else if (currentWeekOffset === -1) weekWord = '지난 주';
    else if (currentWeekOffset === 1) weekWord = '다음 주';
    else weekWord = currentWeekOffset < 0 ? `${-currentWeekOffset}주 전` : `${currentWeekOffset}주 후`;
    document.getElementById('weekLabel').textContent = `${weekWord} ${rangeStr}`;

    document.getElementById('btnWeekPrev').disabled = currentWeekOffset <= WEEK_OFFSET_MIN;
    document.getElementById('btnWeekNext').disabled = currentWeekOffset >= WEEK_OFFSET_MAX;
    document.getElementById('btnWeekToday').style.display = currentWeekOffset === 0 ? 'none' : 'inline';
}

const WEEKDAY_KR = ['일', '월', '화', '수', '목', '금', '토'];
const WEEKDAY_KR_MON_FIRST = ['월', '화', '수', '목', '금', '토', '일'];

// 월간 보기: 그 달에 실제로 방영/공개되는 날짜만 세로 목록으로 — 빈 날짜는 아예 목록에 안 나오는 게
// 한 달 전체를 훑어보기에 가장 효율적이라고 판단해 달력 격자 대신 "일정표" 형태로 만든다.
function renderMonth() {
    const info = getMonthInfo(currentMonthOffset);
    const filteredData = getFilteredDramas();

    // 날짜(ISO) -> [{drama, epText}] 로 모은다
    const byDate = {};
    const addEntry = (dateISO, drama, epText, channelLabel) => {
        if (dateISO < info.firstISO || dateISO > info.lastISO) return;
        if (!byDate[dateISO]) byDate[dateISO] = [];
        byDate[dateISO].push({ drama, epText, channelLabel });
    };
    filteredData.forEach(drama => {
        // 이 작품이 실제로 걸리는 모든 날짜를 모은다 — 작품 기본 스케줄뿐 아니라, TVING 선공개처럼
        // 플랫폼마다 자체 schedule/releaseDate가 다르면 그 날짜들도 각각 별도로 잡아준다.
        const byDateInfo = {}; // dateISO -> { epText, channels: Set }
        const record = (dateISO, epText, channelLabel) => {
            const entry = byDateInfo[dateISO] || (byDateInfo[dateISO] = { epText, channels: new Set() });
            entry.channels.add(channelLabel);
        };
        drama.platforms.forEach(p => {
            const eff = effectiveForChannel(drama, p);
            if (eff.isBatch) {
                if (eff.releaseDate) record(eff.releaseDate, eff.batchEp || '전편 공개', p.label);
            } else if (eff.schedule) {
                Object.entries(eff.schedule).forEach(([dateISO, epText]) => record(dateISO, epText, p.label));
            }
        });
        Object.entries(byDateInfo).forEach(([dateISO, { epText, channels }]) => {
            addEntry(dateISO, drama, epText, [...channels].join(' · '));
        });
    });

    const monthList = document.getElementById('monthList');
    monthList.innerHTML = '';
    const sortedDates = Object.keys(byDate).sort();

    if (sortedDates.length === 0) {
        monthList.innerHTML = `<div class="month-empty-state">${info.year}년 ${info.month}월엔 확인된 편성이 없습니다.</div>`;
    }

    sortedDates.forEach(dateISO => {
        const dateObj = new Date(`${dateISO}T12:00:00`);
        const [, mm, dd] = dateISO.split('-');
        const isToday = dateISO === todayISO;
        const group = document.createElement('div');
        group.className = 'month-day-group';
        const label = document.createElement('div');
        label.className = 'month-day-label';
        label.textContent = `${parseInt(mm, 10)}월 ${parseInt(dd, 10)}일 (${WEEKDAY_KR[dateObj.getDay()]})` + (isToday ? ' · 오늘' : '');
        group.appendChild(label);
        byDate[dateISO].forEach(({ drama, epText, channelLabel }) => {
            group.appendChild(makeDramaCard(drama, epText, { channelLabel }));
        });
        monthList.appendChild(group);
    });

    // 넓은 화면용 달력 격자 (CSS가 폭에 따라 이거 아니면 위의 monthList 중 하나만 보여준다)
    const monthCalendar = document.getElementById('monthCalendar');
    monthCalendar.innerHTML = '';
    WEEKDAY_KR_MON_FIRST.forEach(kr => {
        const el = document.createElement('div');
        el.className = 'cal-weekday';
        el.textContent = kr;
        monthCalendar.appendChild(el);
    });
    const firstDate = new Date(info.year, info.month - 1, 1, 12);
    const leadingBlanks = (firstDate.getDay() + 6) % 7; // 월요일 시작 기준 앞쪽 빈 칸 수
    const totalCells = Math.ceil((leadingBlanks + info.daysInMonth) / 7) * 7;
    for (let i = 0; i < totalCells; i++) {
        const dayNum = i - leadingBlanks + 1;
        const cell = document.createElement('div');
        if (dayNum < 1 || dayNum > info.daysInMonth) {
            cell.className = 'cal-cell cal-blank';
            monthCalendar.appendChild(cell);
            continue;
        }
        const dateISO = `${info.year}-${String(info.month).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
        cell.className = 'cal-cell' + (dateISO === todayISO ? ' cal-today' : '');
        const num = document.createElement('div');
        num.className = 'cal-daynum';
        num.textContent = dayNum;
        cell.appendChild(num);
        const entriesWrap = document.createElement('div');
        entriesWrap.className = 'cal-entries';
        (byDate[dateISO] || []).forEach(({ drama, epText }) => {
            entriesWrap.appendChild(makeDramaCard(drama, epText));
        });
        cell.appendChild(entriesWrap);
        monthCalendar.appendChild(cell);
    }

    document.getElementById('monthLabel').textContent = info.label;
    document.getElementById('btnMonthPrev').disabled = currentMonthOffset <= MONTH_OFFSET_MIN;
    document.getElementById('btnMonthNext').disabled = currentMonthOffset >= MONTH_OFFSET_MAX;
    document.getElementById('btnMonthToday').style.display = currentMonthOffset === 0 ? 'none' : 'inline';
}

// 주간 / 월간 보기 전환
function switchView(view) {
    currentView = view;
    document.getElementById('btnViewWeek').classList.toggle('active', view === 'week');
    document.getElementById('btnViewMonth').classList.toggle('active', view === 'month');
    document.getElementById('weekView').style.display = view === 'week' ? '' : 'none';
    document.getElementById('weekToggle').style.display = view === 'week' ? '' : 'none';
    document.getElementById('monthView').style.display = view === 'month' ? '' : 'none';
    document.getElementById('monthToggle').style.display = view === 'month' ? '' : 'none';
    const notice = document.getElementById('weekEmptyNotice');
    if (view === 'month') {
        if (notice) notice.style.display = 'none';
        renderMonth();
    } else {
        if (notice) notice.style.display = '';
        renderWeek();
    }
}

// 제목을 누르면 언제나 "이번 주" 첫 화면으로 돌아간다
function goHome() {
    currentWeekOffset = 0;
    switchView('week');
}

// Highlight today's column (다음 주를 보고 있을 땐 오늘이 그 주에 없으므로 하이라이트 없음)
function highlightToday() {
    syncTodayState();
    const headers = document.querySelectorAll('th[data-day]');
    headers.forEach((th) => {
        th.classList.remove('today-col');
        const badge = th.querySelector('.today-badge');
        if (badge) badge.remove();
    });
    if (currentWeekOffset !== 0) return;
    const headerToday = document.querySelector(`th[data-day="${todayStr}"]`);
    if (headerToday) {
        headerToday.classList.add('today-col');
        headerToday.innerHTML += ' <span class="today-badge">오늘</span>';
    }
}

// 오늘 칸의 채널 행들 사이 간격까지 같은 색으로 메워서 컬럼이 끊기지 않고 이어져 보이게 한다.
// (헤더와 첫 채널 행 사이의 간격은 그대로 남겨둔다 — 요청대로 그 부분만 여백 유지)
function paintTodayColumnFill() {
    const existing = document.getElementById('todayColFill');
    if (existing) existing.remove();

    // 표가 세로 목록으로 바뀌는 모바일 레이아웃에서는 "컬럼" 개념이 없으므로 칠하지 않는다.
    if (window.innerWidth <= 768) return;

    const bodyTds = document.querySelectorAll('#guideBody td.today-col');
    if (bodyTds.length < 2) return; // 채널 행이 1개 이하면 이어붙일 간격도 없다

    const container = document.getElementById('weekView');
    const containerRect = container.getBoundingClientRect();
    const firstTd = bodyTds[0];
    const lastTd = bodyTds[bodyTds.length - 1];
    const firstRect = firstTd.getBoundingClientRect();
    const lastRect = lastTd.getBoundingClientRect();

    const fill = document.createElement('div');
    fill.id = 'todayColFill';
    fill.style.left = (firstRect.left - containerRect.left + container.scrollLeft) + 'px';
    fill.style.top = (firstRect.top - containerRect.top + container.scrollTop) + 'px';
    fill.style.width = firstRect.width + 'px';
    fill.style.height = (lastRect.bottom - firstRect.top) + 'px';
    container.appendChild(fill);
}

// 주간 표(칸 안)와 월간 목록에서 공통으로 쓰는 드라마 카드 DOM을 만든다.
// opts.channelLabel이 있으면(월간 보기처럼 요일 열이 없을 때) 회차 옆에 채널명을 같이 적어준다.
function makeDramaCard(drama, epText, opts = {}) {
    const isStarred = myWatchlist.includes(drama.id);
    const metaText = opts.channelLabel ? `${opts.channelLabel} · ${epText}` : epText;
    // 정확한 날짜가 아직 안 나와 "(미정)"으로 임시 배치된 항목은 카드를 흐리게 가라앉힌다.
    const isTentative = /\(미정\)/.test(epText);
    const card = document.createElement('div');
    card.className = 'drama-card' + (isStarred ? ' starred' : '') + (isTentative ? ' tentative' : '');
    card.innerHTML = `
        <span class="drama-title-link" role="button" tabindex="0" onclick="openModal('${drama.id}')" onkeydown="if(event.key==='Enter')openModal('${drama.id}')" title="${drama.title} 상세 정보">
            ${drama.title}
        </span>
        <div class="drama-card-footer">
            <span class="ep-tag">${metaText}</span>
            <div class="card-actions">
                <button class="btn-icon btn-star ${isStarred ? '' : 'empty'}" onclick="toggleStar('${drama.id}', event)" title="내 리스트">${isStarred ? '★' : '☆'}</button>
            </div>
        </div>
    `;
    return card;
}

// 주간/월간 보기가 공통으로 쓰는 필터(현재는 "내 리스트만 보기" 하나뿐)
function getFilteredDramas() {
    return DRAMA_DATA.filter(drama => {
        if(showOnlyWatchlist && !myWatchlist.includes(drama.id)) return false;
        if(regionMode !== 'ALL' && !drama.platforms.some(p => platformRegions(p.name).includes(regionMode))) return false;
        return true;
    });
}

// 최근 2주 넘게 새로 뜬 게 없는 채널인지 판별한다.
// - 정규 편성: schedule 날짜 중 하나라도 (오늘-14일) 이후(=최근 방영했거나 앞으로 방영 예정)면 활성.
// - 전편 공개/라이브러리 추가: 공개일 자체가 최근 14일 이내이거나, 아직 배치 노출 기간(회차/2주, getBatchWindow) 안이면 활성.
//   해외 스트리밍이 오래전에 방영된 국내 드라마를 뒤늦게 라이브러리에 새로 들여온 경우도, 그 노출 기간 동안은
//   계속 활성으로 잡힌다 — "신작"인지가 아니라 "그 채널에서 지금 볼 수 있는 게 있는지"가 기준.
function isChannelActive(ch) {
    const cutoff = new Date(`${todayISO}T12:00:00`);
    cutoff.setDate(cutoff.getDate() - 14);
    const cutoffISO = toISODate(cutoff);
    return DRAMA_DATA.some(d => {
        if (!d.platforms.some(p => p.name.includes(ch.id))) return false;
        if (d.isBatch) {
            if (!d.releaseDate) return false;
            const { endISO } = getBatchWindow(d);
            return d.releaseDate >= cutoffISO || todayISO < endISO;
        }
        return d.schedule && Object.keys(d.schedule).some(dateISO => dateISO >= cutoffISO);
    });
}

// 현재 지역 모드에서 실제로 보여줄 채널 행만 추린다 ('ALL'이면 전부) + 2주 넘게 잠잠한 채널은 아예 제외.
function visibleChannels() {
    return CHANNELS.filter(ch => (regionMode === 'ALL' || ch.regions.includes(regionMode)) && isChannelActive(ch));
}

function setRegion(mode) {
    regionMode = mode;
    localStorage.setItem('kdrama_region', mode);
    document.getElementById('btnRegionUS').classList.toggle('active', mode === 'US');
    document.getElementById('btnRegionKR').classList.toggle('active', mode === 'KR');
    document.getElementById('btnRegionAll').classList.toggle('active', mode === 'ALL');
    syncTodayState();
    updateLiveClock();
    updateWeekBadge();
    if (currentView === 'month') renderMonth();
    else { renderWeek(); }
}

// Render the grid for the currently selected week (currentWeekOffset)
function renderGrid() {
    guideBody.innerHTML = '';

    const filteredData = getFilteredDramas();
    const weekDates = getWeekDates(currentWeekOffset); // [{key, dateISO, label, isToday}, ...] Mon~Sun
    const weekSundayISO = getWeekSundayISO(currentWeekOffset);
    let weekHasAnyContent = false;

    visibleChannels().forEach(ch => {
        const tr = document.createElement('tr');
        let hasAnyContent = false;

        // Channel cell
        const tdCh = document.createElement('td');
        tdCh.innerHTML = `<div>${ch.num}</div><div class="ch-logo ${ch.cssClass}">${ch.name}</div>`;
        tr.appendChild(tdCh);

        // Days
        COLUMNS.forEach(day => {
            const td = document.createElement('td');
            const dateInfo = weekDates.find(w => w.key === day); // undefined for 'Batch'
            if (dateInfo && dateInfo.isToday) td.classList.add('today-col');
            // 모바일에서는 표가 세로 목록으로 바뀌는데, 이때 각 칸 앞에 붙일 요일 라벨.
            td.dataset.label = dateInfo ? dateInfo.label.replace(' 오늘', '') : '전편 공개';

            // Find dramas for this channel and this exact calendar date (or the Batch column).
            // 전편 공개작은 공개된 그 날짜의 요일 칸에 표시하고, 그 이후 주부터는 Batch 열로 옮겨 계속 보여준다(중복 방지).
            const dateKey = dateInfo ? dateInfo.dateISO : null;
            const cellDramas = filteredData.filter(d => {
                const platform = d.platforms.find(p => p.name.includes(ch.id));
                if(!platform) return false;
                // 스케줄/배치일이 플랫폼마다 다를 수 있으므로, "이 채널의" 플랫폼이 이 칸에 실제로
                // 걸리는지를 봐야 한다(다른 플랫폼이 이 칸에 걸린다고 이 채널 칸을 채우면 안 됨).
                const eff = effectiveForChannel(d, platform);
                let isOnThisCell;
                if(day === 'Batch') {
                    if(!eff.isBatch || !eff.releaseDate) isOnThisCell = false;
                    else {
                        const { releaseISO, endISO } = getBatchWindow({ ...d, releaseDate: eff.releaseDate });
                        isOnThisCell = releaseISO < weekDates[0].dateISO && weekDates[0].dateISO < endISO;
                    }
                } else if(eff.isBatch) {
                    isOnThisCell = eff.releaseDate === dateKey;
                } else {
                    isOnThisCell = !!(eff.schedule && Object.prototype.hasOwnProperty.call(eff.schedule, dateKey));
                }
                return isOnThisCell;
            });

            if(cellDramas.length === 0) {
                td.classList.add('empty-cell');
                td.textContent = '-';
            } else {
                hasAnyContent = true;
                cellDramas.forEach(drama => {
                    const platform = drama.platforms.find(p => p.name.includes(ch.id));
                    const eff = effectiveForChannel(drama, platform);
                    const epText = eff.isBatch ? (eff.batchEp || '전편 공개') : eff.schedule[dateKey];
                    td.appendChild(makeDramaCard(drama, epText));
                });
            }
            tr.appendChild(td);
        });
        if (!hasAnyContent) tr.classList.add('row-empty');
        if (hasAnyContent) weekHasAnyContent = true;
        guideBody.appendChild(tr);
    });

    // 리서치된 데이터가 아직 그 주까지 닿지 않아서 통째로 비어 있는 경우, 버그처럼 보이지 않도록 안내한다.
    const existingNotice = document.getElementById('weekEmptyNotice');
    if (existingNotice) existingNotice.remove();
    if (!weekHasAnyContent) {
        const notice = document.createElement('div');
        notice.id = 'weekEmptyNotice';
        notice.className = 'month-empty-state';
        notice.textContent = '이 주는 확인된 편성 데이터가 없습니다 (아직 리서치되지 않았거나, 방영 중인 작품이 없는 기간).';
        document.getElementById('weekView').insertAdjacentElement('afterend', notice);
    }
}

// Watchlist toggle
function toggleStar(id, e) {
    if(e) e.stopPropagation();
    if(myWatchlist.includes(id)) {
        myWatchlist = myWatchlist.filter(vid => vid !== id);
    } else {
        myWatchlist.push(id);
    }
    localStorage.setItem('kdrama_watchlist', JSON.stringify(myWatchlist));
    if (currentView === 'month') {
        renderMonth();
    } else {
        renderGrid();
        paintTodayColumnFill();
    }

    // Update modal button if open
    const modalBtn = document.getElementById('modalToggleStar');
    if(modalBtn && document.getElementById('detailsModal').classList.contains('show')) {
        modalBtn.textContent = myWatchlist.includes(id) ? '⭐ 내 리스트에서 제거' : '☆ 내 리스트에 추가';
    }
}

// Modal Logic
function openModal(id) {
    const drama = DRAMA_DATA.find(d => d.id === id);
    if(!drama) return;

    document.getElementById('modalTitle').textContent = drama.title;
    document.getElementById('modalEngTitle').textContent = drama.engTitle;
    document.getElementById('modalEpisodes').textContent = drama.episodes;
    document.getElementById('modalRating').textContent = drama.rating;
    document.getElementById('modalCast').textContent = drama.cast;
    document.getElementById('modalSynopsis').textContent = drama.synopsis;
    const modalPoster = document.querySelector('.modal-poster');
    const modalImg = document.getElementById('modalImg');
    modalPoster.classList.toggle('is-missing', !drama.poster);
    modalImg.alt = drama.poster ? `${drama.title} 포스터` : '';
    modalImg.onerror = () => modalPoster.classList.add('is-missing');
    modalImg.src = drama.poster || '';

    // Platforms
    const pContainer = document.getElementById('modalPlatforms');
    pContainer.innerHTML = '<strong>시청 바로가기:</strong><br>';
    drama.platforms.forEach(p => {
        const a = document.createElement('a');
        a.href = p.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = `${p.label} 시청하기`;
        a.style.display = 'block';
        a.style.margin = '4px 0';
        a.style.padding = '0';
        a.style.backgroundColor = 'transparent';
        a.style.color = 'var(--text-color)';
        a.style.textDecoration = 'underline';
        a.style.textUnderlineOffset = '3px';
        a.style.borderRadius = '0';
        a.style.fontWeight = 'bold';
        a.style.border = 'none';
        pContainer.appendChild(a);
    });

    // Star button
    const isStarred = myWatchlist.includes(drama.id);
    const starBtn = document.getElementById('modalToggleStar');
    starBtn.textContent = isStarred ? '⭐ 내 리스트에서 제거' : '☆ 내 리스트에 추가';
    starBtn.onclick = () => toggleStar(drama.id);

    document.getElementById('detailsModal').classList.add('show');
}

function closeModal() {
    document.getElementById('detailsModal').classList.remove('show');
}

// Event Listeners
function setupListeners() {
    btnWatchlist.addEventListener('click', () => {
        setWatchlistFilter(!showOnlyWatchlist);
    });

    document.getElementById('btnViewWeek').addEventListener('click', () => switchView('week'));
    document.getElementById('btnViewMonth').addEventListener('click', () => switchView('month'));

    document.getElementById('btnRegionUS').addEventListener('click', () => setRegion('US'));
    document.getElementById('btnRegionKR').addEventListener('click', () => setRegion('KR'));
    document.getElementById('btnRegionAll').addEventListener('click', () => setRegion('ALL'));

    document.getElementById('btnWeekPrev').addEventListener('click', () => {
        currentWeekOffset = Math.max(WEEK_OFFSET_MIN, currentWeekOffset - 1);
        renderWeek();
    });
    document.getElementById('btnWeekNext').addEventListener('click', () => {
        currentWeekOffset = Math.min(WEEK_OFFSET_MAX, currentWeekOffset + 1);
        renderWeek();
    });
    document.getElementById('btnWeekToday').addEventListener('click', () => {
        currentWeekOffset = 0;
        renderWeek();
    });

    document.getElementById('btnMonthPrev').addEventListener('click', () => {
        currentMonthOffset = Math.max(MONTH_OFFSET_MIN, currentMonthOffset - 1);
        renderMonth();
    });
    document.getElementById('btnMonthNext').addEventListener('click', () => {
        currentMonthOffset = Math.min(MONTH_OFFSET_MAX, currentMonthOffset + 1);
        renderMonth();
    });
    document.getElementById('btnMonthToday').addEventListener('click', () => {
        currentMonthOffset = 0;
        renderMonth();
    });

    document.getElementById('closeModal').addEventListener('click', closeModal);

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if(e.target === overlay) closeModal();
        });
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape') closeModal();
        if(e.key === 'ArrowLeft') document.getElementById(currentView === 'month' ? 'btnMonthPrev' : 'btnWeekPrev').click();
        if(e.key === 'ArrowRight') document.getElementById(currentView === 'month' ? 'btnMonthNext' : 'btnWeekNext').click();
    });
}

// 창 폭이 바뀌면(칸 너비가 clamp()로 유동적이라) 오늘 칸 칠도 다시 계산한다.
// window의 'resize' 이벤트뿐 아니라 실제 레이아웃(표 크기) 변화를 직접 감지하는 ResizeObserver도 같이 써서
// 프로그램적으로 뷰포트가 바뀌는 경우(예: 자동화 테스트, 일부 브라우저 확대/축소)도 놓치지 않게 한다.
let resizeTimer;
function scheduleFillRepaint() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        if (currentView === 'week') paintTodayColumnFill();
    }, 120);
}
window.addEventListener('resize', scheduleFillRepaint);
if (window.ResizeObserver) {
    new ResizeObserver(scheduleFillRepaint).observe(document.getElementById('weekView'));
}

// Start
init();
</script>
