<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Drama US Streaming TV Guide | 미국 K-드라마 주간 편성표</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Courier+Prime:wght@400;700&display=swap');

        /* 종이에 타이핑된 듯한 미니멀 모노크롬 — 버튼/카드의 입체 효과와 브랜드 컬러를 걷어내고
           단일 잉크색(ink) + 종이색(paper)만으로 구성한다. 3개 테마 모두 이 규칙을 공유한다. */
        :root {
            --bg-color: #f7f5ef;
            --text-color: #1c1c1a;
            --text-soft: rgba(28, 28, 26, 0.55);
            --border-color: rgba(28, 28, 26, 0.4);
            --border-strong: #1c1c1a;
            --cell-bg: #f7f5ef;
            --header-bg: transparent;
            --sticky-bg: #f7f5ef;
            --btn-bg: transparent;
            --btn-text: #1c1c1a;
            --link-color: #1c1c1a;
            --today-glow: none;
            --today-bg: rgba(28, 28, 26, 0.05);
            --today-border: #1c1c1a;
            --font-main: 'Nanum Gothic Coding', 'Courier Prime', monospace;
            --font-heading: 'Nanum Gothic Coding', 'Courier Prime', monospace;
            --font-mono: 'Courier Prime', 'Nanum Gothic Coding', monospace;
            --shadow: none;
            --transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            --empty-pattern: none;
        }

        [data-theme="crt"] {
            --bg-color: #0a0a0a;
            --text-color: #cfcfcf;
            --text-soft: rgba(207, 207, 207, 0.55);
            --border-color: rgba(207, 207, 207, 0.35);
            --border-strong: #cfcfcf;
            --cell-bg: #0a0a0a;
            --sticky-bg: #0a0a0a;
            --btn-text: #cfcfcf;
            --link-color: #cfcfcf;
            --today-bg: rgba(207, 207, 207, 0.08);
            --today-border: #cfcfcf;
        }

        [data-theme="modern"] {
            --bg-color: #16181d;
            --text-color: #e8e8e6;
            --text-soft: rgba(232, 232, 230, 0.55);
            --border-color: rgba(232, 232, 230, 0.35);
            --border-strong: #e8e8e6;
            --cell-bg: #16181d;
            --sticky-bg: #16181d;
            --btn-text: #e8e8e6;
            --link-color: #e8e8e6;
            --today-bg: rgba(232, 232, 230, 0.08);
            --today-border: #e8e8e6;
        }

        * {
            box-sizing: border-box;
            transition: var(--transition);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 16px;
            font-size: 14px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--font-heading);
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.55rem;
            letter-spacing: 0.03em;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .live-clock-badge {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: normal;
            color: var(--text-soft);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .controls {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .controls button {
            background: none;
            color: var(--text-soft);
            border: none;
            padding: 2px 0;
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 0.85rem;
            letter-spacing: 0.02em;
        }

        .controls button:hover {
            color: var(--text-color);
        }

        .controls button.active {
            color: var(--text-color);
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .controls button:disabled {
            opacity: 0.25;
            cursor: default;
        }

        .week-label {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-color);
            min-width: 150px;
            text-align: center;
        }

        .week-today-link {
            font-size: 0.75rem !important;
            color: var(--text-soft) !important;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* TV Guide Grid */
        .grid-container {
            overflow-x: auto;
            border: none;
            background-color: var(--bg-color);
            border-radius: 0;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1260px;
            table-layout: fixed;
        }

        th, td {
            border: none;
            padding: 10px 8px;
            vertical-align: top;
        }

        tbody td {
            border-top: 1px solid var(--border-color);
        }

        th {
            background-color: var(--header-bg);
            border-bottom: 1.5px solid var(--border-strong);
            position: sticky;
            top: 0;
            z-index: 10;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
        }

        th.channel-th {
            width: 150px;
            left: 0;
            z-index: 20;
            background-color: var(--sticky-bg);
            text-align: left;
        }

        th.batch-th {
            width: 180px;
            font-style: italic;
            border-left: 1px solid var(--border-color);
        }

        td.batch-cell {
            border-left: 1px solid var(--border-color);
        }

        /* Sticky First Column for Channels */
        td:first-child {
            position: sticky;
            left: 0;
            background-color: var(--sticky-bg);
            z-index: 5;
            font-family: var(--font-mono);
            font-weight: bold;
            text-align: left;
            border-right: 1px solid var(--border-strong);
            vertical-align: middle;
            padding: 10px 8px;
        }

        .ch-logo {
            display: block;
            padding: 0;
            border-radius: 0;
            color: var(--text-soft);
            background: transparent;
            font-size: 0.72rem;
            margin-top: 2px;
            font-weight: 400;
            letter-spacing: 0.03em;
            border: none;
        }

        /* Today Highlight */
        .today-col {
            background-color: var(--today-bg) !important;
        }

        .today-badge {
            display: inline-block;
            font-size: 0.68rem;
            background: transparent;
            color: var(--text-color);
            padding: 0;
            margin-left: 4px;
            vertical-align: middle;
        }

        /* Empty Cell */
        .empty-cell {
            text-align: center;
            color: var(--text-soft);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding-top: 15px;
        }

        /* Drama Card inside grid cell — 박스 없이 여백과 굵기 대비로만 구획한다 */
        .drama-card {
            background-color: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .drama-card:last-child {
            margin-bottom: 0;
        }

        /* 한 칸에 여러 작품이 겹칠 때(예: 코코와 수요일) 서로 구분되도록 가는 구분선을 위에 하나 긋는다 */
        .drama-card + .drama-card {
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .drama-card-footer {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 8px;
        }

        .drama-title-link {
            font-family: var(--font-heading);
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--link-color);
            text-decoration: none;
            cursor: pointer;
            line-height: 1.3;
            word-break: keep-all;
            display: inline-block;
        }

        .drama-title-link:hover,
        .drama-title-link:focus-visible {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .drama-title-link:focus-visible {
            outline: 1px solid var(--border-strong);
            outline-offset: 2px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-size: 0.72rem;
            font-family: var(--font-mono);
            color: var(--text-soft);
            opacity: 1;
            line-height: 1;
        }

        .btn-icon:hover {
            color: var(--text-color);
        }

        .btn-star {
            font-size: 0.8rem !important;
        }

        .btn-star.empty {
            opacity: 0.4;
        }

        .ep-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: normal;
            font-family: var(--font-mono);
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text-soft);
            white-space: nowrap;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-color);
            border: 1px solid var(--border-strong);
            border-radius: 0;
            max-width: 580px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            display: flex;
            gap: 16px;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 14px;
            background: transparent;
            color: var(--text-soft);
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            width: auto;
            height: auto;
            line-height: 1;
            text-align: center;
            font-weight: normal;
        }

        .modal-close:hover {
            color: var(--text-color);
        }

        .modal-close:hover {
            border-color: var(--border-strong);
        }

        .modal-poster {
            width: 140px;
            flex-shrink: 0;
        }

        .modal-poster img {
            width: 100%;
            border-radius: 0;
            border: 1px solid var(--border-color);
            object-fit: cover;
            filter: grayscale(1) contrast(1.05);
        }

        .modal-info {
            flex-grow: 1;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .modal-info h2 {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 2px;
        }

        .modal-star-btn {
            background-color: transparent;
            color: var(--btn-text);
            border: none;
            padding: 0;
            border-radius: 0;
            cursor: pointer;
            margin-top: 14px;
            font-family: var(--font-heading);
            font-weight: bold;
            font-size: 0.9rem;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .modal-star-btn:hover {
            opacity: 0.7;
        }

        /* Roulette Modal */
        .roulette-container {
            text-align: center;
            padding: 16px;
            width: 100%;
        }

        .slot-machine {
            font-size: 1.6rem;
            height: 54px;
            overflow: hidden;
            border: 1px solid var(--border-strong);
            background-color: var(--bg-color);
            margin: 16px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--text-color);
        }

        .slot-poster {
            width: 160px;
            margin: 0 auto 12px;
            display: none;
        }

        .slot-poster img {
            width: 100%;
            border-radius: 0;
            border: 1px solid var(--border-color);
            filter: grayscale(1) contrast(1.05);
        }

        @media print {
            .toolbar, .modal-overlay { display: none !important; }
            body { background: white; color: black; }
            .grid-container { box-shadow: none; border: none; }
            th, td { border: 1px solid #ccc; }
        }

        @media (max-width: 768px) {
            .modal-content { flex-direction: column; }
            .modal-poster { width: 100px; margin: 0 auto; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .controls { display: flex; flex-wrap: wrap; gap: 5px; }
            .controls button { flex: 1; margin: 0; }
        }
    </style>
</head>
<body data-theme="paper">

<div class="container">

    <div class="grid-container">
        <table id="guideTable">
            <thead>
                <tr>
                    <th class="channel-th">CHANNEL / OTT</th>
                    <th data-day="Mon">월 (8/17)</th>

            </thead>
            <tbody id="guideBody">
                <!-- Rows injected via JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Details Modal -->
<div class="modal-overlay" id="detailsModal">
    <div class="modal-content">
        <button class="modal-close" id="closeModal">&times;</button>
        <div class="modal-poster">
            <img id="modalImg" src="" alt="Poster" onerror="this.src='https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&w=300&q=80'">
        </div>
        <div class="modal-info">
            <h2 id="modalTitle"></h2>
            <p id="modalEngTitle" style="color: var(--text-soft); margin-top: -2px; font-family: var(--font-mono); font-size: 0.85rem;"></p>
            <p style="margin: 8px 0;"><strong>방영 회차:</strong> <span id="modalEpisodes"></span> | <strong>시청률:</strong> <span id="modalRating"></span></p>
            <p style="margin: 6px 0;"><strong>출연진:</strong> <span id="modalCast"></span></p>
            <p style="margin: 8px 0; background: transparent; padding: 8px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); border-radius: 0;">
                <strong>줄거리:</strong> <span id="modalSynopsis"></span>
            </p>
            <div id="modalPlatforms" style="margin-top: 12px;"></div>
            <button class="modal-star-btn" id="modalToggleStar">내 리스트에 추가</button>
        </div>
    </div>
</div>

<!-- Roulette Modal -->
<div class="modal-overlay" id="rouletteModal">
    <div class="modal-content" style="max-width: 420px; display: block;">
        <button class="modal-close" id="closeRoulette">&times;</button>
        <div class="roulette-container">
            <h2 style="font-family: var(--font-heading); margin-top: 0;">오늘의 K-드라마 채널 서핑</h2>
            <div class="slot-poster" id="roulettePoster">
                <img id="rouletteImg" src="" alt="Drama Poster" onerror="this.src='https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&w=300&q=80'">
            </div>
            <div class="slot-machine">
                <div class="slot-content" id="slotContent">준비 완료!</div>
            </div>
            <div id="rouletteLinks" style="margin-bottom: 12px; display: none;"></div>
            <button id="btnSpin" style="background:transparent; color:var(--text-color); padding:8px 0; border:none; border-bottom:1px solid var(--border-strong); border-radius:0; font-family:var(--font-heading); cursor:pointer; font-size:1rem; font-weight:bold;">
                채널 돌리기
            </button>
        </div>
    </div>
</div>

const DAY_ORDER = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAY_KR = { Mon: "월", Tue: "화", Wed: "수", Thu: "목", Fri: "금", Sat: "토", Sun: "일" };
const COLUMNS = [...DAY_ORDER, "Batch"];

let currentWeekOffset = 0; // 0 = 이번 주. 음수 = 지난 주들, 양수 = 다음 주들.
const WEEK_OFFSET_MIN = -4; // 최대 한 달 전
const WEEK_OFFSET_MAX = 4;  // 최대 한 달 후

// Today detection (US Eastern Time)
function getUSEasternDay() {
    const options = { timeZone: "America/New_York", weekday: 'short' };
    const dayName = new Intl.DateTimeFormat('en-US', options).format(new Date());
    return dayName; // "Mon", "Tue", etc.
}
const todayStr = getUSEasternDay();

// Compute "today" and week Mondays in US Eastern time so the header never goes stale like a hardcoded date would.
function getUSEasternDate() {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: "America/New_York", year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
    const map = {};
    parts.forEach(p => map[p.type] = p.value);
    return new Date(`${map.year}-${map.month}-${map.day}T12:00:00`); // noon avoids DST edge issues
}
function toISODate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const todayISO = toISODate(getUSEasternDate());

function getWeekMonday(offset) {
    const today = getUSEasternDate();
    const jsWeekday = today.getDay(); // 0=Sun..6=Sat
    const mondayOffset = jsWeekday === 0 ? -6 : 1 - jsWeekday;
    const monday = new Date(today);
    monday.setDate(today.getDate() + mondayOffset + offset * 7);
    return monday;
}
// 선택된 주(offset)의 월~일 7일치 {key, dateISO, label} 배열을 계산한다.
function getWeekDates(offset) {
    const monday = getWeekMonday(offset);
    return DAY_ORDER.map((key, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateISO = toISODate(d);
        let label = `${DAY_KR[key]} (${d.getMonth() + 1}/${d.getDate()})`;
        return { key, dateISO, label, isToday: dateISO === todayISO };
    });
}
function getWeekSundayISO(offset) {
    const dates = getWeekDates(offset);
    return dates[dates.length - 1].dateISO;
}

// 전편 공개(batch) 작품이 편성표에 노출되는 [공개일, 종료일) 구간을 ISO 날짜 문자열로 계산한다.
// 12부작이면 6주(회차/2), 즉 주 2회 편성이었다면 걸렸을 기간만큼만 "지금 볼만한 신작"으로 보여준다.
function getBatchWindow(drama) {
    const epMatch = (drama.episodes || "").match(/\d+/);
    const epCount = epMatch ? parseInt(epMatch[0], 10) : 2;
    const visibleWeeks = Math.max(1, Math.ceil(epCount / 2));
    const release = new Date(`${drama.releaseDate}T12:00:00`);
    const end = new Date(release);
    end.setDate(end.getDate() + visibleWeeks * 7);
    return { releaseISO: drama.releaseDate, endISO: toISODate(end) };
}

function updateDateHeaders(offset) {
    const weekDates = getWeekDates(offset);
    weekDates.forEach(({ key, label }) => {
        const th = document.querySelector(`th[data-day="${key}"]`);
        if (th) th.textContent = label;
    });
}

// Live Clock
function updateLiveClock() {
    const options = { timeZone: "America/New_York", hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
    const timeStr = new Intl.DateTimeFormat('en-US', options).format(new Date());
    const el = document.getElementById('liveClock');
    if (el) el.textContent = `US EST ${timeStr}`;
}

// 헤더의 "[n월 n주차: m/d ~ m/d 주간 본방]" 배지 — 하드코딩 대신 오늘 날짜 기준(이번 주)으로 항상 계산한다.
function updateWeekBadge() {
    const el = document.getElementById('weekBadge');
    if (!el) return;
    const thisWeek = getWeekDates(0);
    const monday = thisWeek[0], sunday = thisWeek[6];
    const [my, mm, md] = monday.dateISO.split('-').map(Number);
    const weekOfMonth = Math.ceil(md / 7);
    const [, sm, sd] = sunday.dateISO.split('-').map(Number);
    el.textContent = `[${my}년 ${mm}월 ${weekOfMonth}주차: ${mm}/${md} ~ ${sm}/${sd} 주간 본방]`;
}

// 이번 주 / 다음 주 전환 시 헤더 날짜·오늘 하이라이트·그리드를 한 번에 다시 그린다.
function renderWeek() {
    updateDateHeaders(currentWeekOffset);
    highlightToday();
    renderGrid();

    // 주 라벨: 이번 주/지난 주/다음 주는 말로, 그 이상은 "N주 전/후"로 + 실제 날짜 범위를 항상 같이 보여준다.
    const weekDates = getWeekDates(currentWeekOffset);
    const isoToMD = iso => { const [, m, d] = iso.split('-'); return `${parseInt(m,10)}/${parseInt(d,10)}`; };
    const rangeStr = `(${isoToMD(weekDates[0].dateISO)}~${isoToMD(weekDates[6].dateISO)})`;
    let weekWord;
    if (currentWeekOffset === 0) weekWord = '이번 주';
    else if (currentWeekOffset === -1) weekWord = '지난 주';
    else if (currentWeekOffset === 1) weekWord = '다음 주';
    else weekWord = currentWeekOffset < 0 ? `${-currentWeekOffset}주 전` : `${currentWeekOffset}주 후`;
    document.getElementById('weekLabel').textContent = `${weekWord} ${rangeStr}`;

    document.getElementById('btnWeekPrev').disabled = currentWeekOffset <= WEEK_OFFSET_MIN;
    document.getElementById('btnWeekNext').disabled = currentWeekOffset >= WEEK_OFFSET_MAX;
    document.getElementById('btnWeekToday').style.display = currentWeekOffset === 0 ? 'none' : 'inline';
}

// Highlight today's column (다음 주를 보고 있을 땐 오늘이 그 주에 없으므로 하이라이트 없음)
function highlightToday() {
    const headers = document.querySelectorAll('th[data-day]');
    headers.forEach((th) => {
        th.classList.remove('today-col');
        const badge = th.querySelector('.today-badge');
        if (badge) badge.remove();
    });
    if (currentWeekOffset !== 0) return;
    const headerToday = document.querySelector(`th[data-day="${todayStr}"]`);
    if (headerToday) {
        headerToday.classList.add('today-col');
        headerToday.innerHTML += ' <span class="today-badge">오늘</span>';
    }
}

// Theme management
function setTheme(theme) {
    currentTheme = theme;
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('kdrama_theme', theme);

    document.querySelectorAll('.controls button[id^="btnTheme"]').forEach(btn => btn.classList.remove('active'));
    if (theme === 'paper') document.getElementById('btnThemePaper').classList.add('active');
    if (theme === 'crt') document.getElementById('btnThemeCRT').classList.add('active');
    if (theme === 'modern') document.getElementById('btnThemeModern').classList.add('active');
}

// Render the grid for the currently selected week (currentWeekOffset)
function renderGrid() {
    guideBody.innerHTML = '';

    // Filter data
    const filteredData = DRAMA_DATA.filter(drama => {
        // Watchlist
        if(showOnlyWatchlist && !myWatchlist.includes(drama.id)) return false;

        return true;
    });

    const weekDates = getWeekDates(currentWeekOffset); // [{key, dateISO, label, isToday}, ...] Mon~Sun
    const weekSundayISO = getWeekSundayISO(currentWeekOffset);

    CHANNELS.forEach(ch => {
        const tr = document.createElement('tr');

        // Channel cell
        const tdCh = document.createElement('td');
        tdCh.innerHTML = `<div>${ch.num}</div><div class="ch-logo ${ch.cssClass}">${ch.name}</div>`;
        tr.appendChild(tdCh);

        // Days
        COLUMNS.forEach(day => {
            const td = document.createElement('td');
            const dateInfo = weekDates.find(w => w.key === day); // undefined for 'Batch'
            if(dateInfo && dateInfo.isToday) td.classList.add('today-col');

            // Find dramas for this channel and this exact calendar date (or the Batch column).
            // 전편 공개작은 공개된 그 날짜의 요일 칸에 표시하고, 그 이후 주부터는 Batch 열로 옮겨 계속 보여준다(중복 방지).
            const cellDramas = filteredData.filter(d => {
                const isOnCh = d.platforms.some(p => p.name.includes(ch.id));
                if(!isOnCh) return false;
                if(day === 'Batch') {
                    if(!d.isBatch || !d.releaseDate) return false;
                    const { releaseISO, endISO } = getBatchWindow(d);
                    return releaseISO < weekDates[0].dateISO && weekDates[0].dateISO < endISO;
                }
                if(d.isBatch) return d.releaseDate === dateInfo.dateISO;
                return d.schedule && Object.prototype.hasOwnProperty.call(d.schedule, dateInfo.dateISO);
            });

            if(cellDramas.length === 0) {
                td.classList.add('empty-cell');
                td.textContent = '-';
            } else {
                cellDramas.forEach(drama => {
                    const isStarred = myWatchlist.includes(drama.id);
                    let epText = "";
                    if(drama.isBatch) epText = drama.batchEp || '전편 공개';
                    else epText = drama.schedule[dateInfo.dateISO];

                    const platObj = drama.platforms.find(p => p.name.includes(ch.id)) || drama.platforms[0];

                    // 제목을 누르면 상세 정보(모달)가 뜨고, 실제 시청 링크는 모달 안에 둔다.
                    // 제목을 최대한 넓게 보여주기 위해 별표는 제목 아래 줄로 내린다.
                    const card = document.createElement('div');
                    card.className = 'drama-card';
                    card.innerHTML = `
                        <span class="drama-title-link" role="button" tabindex="0" onclick="openModal('${drama.id}')" onkeydown="if(event.key==='Enter')openModal('${drama.id}')" title="${drama.title} 상세 정보">
                            ${drama.title}
                        </span>
                        <div class="drama-card-footer">
                            <span class="ep-tag">${epText}</span>
                            <div class="card-actions">
                                <button class="btn-icon btn-star ${isStarred ? '' : 'empty'}" onclick="toggleStar('${drama.id}', event)" title="내 리스트">${isStarred ? '★' : '☆'}</button>
                            </div>
                        </div>
                    `;
                    td.appendChild(card);
                });
            }
            tr.appendChild(td);
        });
        guideBody.appendChild(tr);
    });
}

// Watchlist toggle
function toggleStar(id, e) {
    if(e) e.stopPropagation();
    if(myWatchlist.includes(id)) {
        myWatchlist = myWatchlist.filter(vid => vid !== id);
    } else {
        myWatchlist.push(id);
    }
    localStorage.setItem('kdrama_watchlist', JSON.stringify(myWatchlist));
    renderGrid();
    
    // Update modal button if open
    const modalBtn = document.getElementById('modalToggleStar');
    if(modalBtn && document.getElementById('detailsModal').classList.contains('show')) {
        modalBtn.textContent = myWatchlist.includes(id) ? '⭐ 내 리스트에서 제거' : '☆ 내 리스트에 추가';
    }
}

// Modal Logic
function openModal(id) {
    const drama = DRAMA_DATA.find(d => d.id === id);
    if(!drama) return;

    document.getElementById('modalTitle').textContent = drama.title;
    document.getElementById('modalEngTitle').textContent = drama.engTitle;
    document.getElementById('modalEpisodes').textContent = drama.episodes;
    document.getElementById('modalRating').textContent = drama.rating;
    document.getElementById('modalCast').textContent = drama.cast;
    document.getElementById('modalSynopsis').textContent = drama.synopsis;
    document.getElementById('modalImg').src = drama.poster;

    // Platforms
    const pContainer = document.getElementById('modalPlatforms');
    pContainer.innerHTML = '<strong>시청 바로가기:</strong><br>';
    drama.platforms.forEach(p => {
        const a = document.createElement('a');
        a.href = p.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = `${p.label} 시청하기`;
        a.style.display = 'block';
        a.style.margin = '4px 0';
        a.style.padding = '0';
        a.style.backgroundColor = 'transparent';
        a.style.color = 'var(--text-color)';
        a.style.textDecoration = 'underline';
        a.style.textUnderlineOffset = '3px';
        a.style.borderRadius = '0';
        a.style.fontWeight = 'bold';
        a.style.border = 'none';
        pContainer.appendChild(a);
    });

    // Star button
    const isStarred = myWatchlist.includes(drama.id);
    const starBtn = document.getElementById('modalToggleStar');
    starBtn.textContent = isStarred ? '⭐ 내 리스트에서 제거' : '☆ 내 리스트에 추가';
    starBtn.onclick = () => toggleStar(drama.id);

    document.getElementById('detailsModal').classList.add('show');
}

function closeModal() {
    document.getElementById('detailsModal').classList.remove('show');
    document.getElementById('rouletteModal').classList.remove('show');
}

// Roulette Logic
let rouletteInterval;
function openRoulette() {
    const modal = document.getElementById('rouletteModal');
    modal.classList.add('show');
    document.getElementById('roulettePoster').style.display = 'none';
    document.getElementById('rouletteLinks').style.display = 'none';
    document.getElementById('slotContent').textContent = '버튼을 눌러주세요!';
}

function spinRoulette() {
    const btn = document.getElementById('btnSpin');
    btn.disabled = true;
    const slot = document.getElementById('slotContent');
    const posterDiv = document.getElementById('roulettePoster');
    const posterImg = document.getElementById('rouletteImg');
    const linksDiv = document.getElementById('rouletteLinks');
    
    posterDiv.style.display = 'none';
    linksDiv.style.display = 'none';
    
    let pool = DRAMA_DATA;
    let ticks = 0;
    const maxTicks = 18;
    clearInterval(rouletteInterval);
    
    rouletteInterval = setInterval(() => {
        const randomDrama = pool[Math.floor(Math.random() * pool.length)];
        slot.textContent = randomDrama.title;
        ticks++;
        if(ticks >= maxTicks) {
            clearInterval(rouletteInterval);
            const finalDrama = pool[Math.floor(Math.random() * pool.length)];
            slot.textContent = finalDrama.title;
            posterImg.src = finalDrama.poster;
            posterDiv.style.display = 'block';
            
            // Render quick links
            linksDiv.innerHTML = finalDrama.platforms.map(p => `
                <a href="${p.url}" target="_blank" rel="noopener" style="display:inline-block; margin:2px 10px 2px 0; padding:0; background:transparent; color:var(--text-color); text-decoration:underline; text-underline-offset:3px; border:none; border-radius:0; font-weight:bold; font-size:0.85rem;">
                    ${p.label}
                </a>
            `).join('');
            linksDiv.style.display = 'block';
            
            btn.disabled = false;
        }
    }, 75);
}

// Event Listeners
function setupListeners() {
    btnWatchlist.addEventListener('click', () => {
        showOnlyWatchlist = !showOnlyWatchlist;
        btnWatchlist.classList.toggle('active');
        renderGrid();
    });

    document.getElementById('btnWeekPrev').addEventListener('click', () => {
        currentWeekOffset = Math.max(WEEK_OFFSET_MIN, currentWeekOffset - 1);
        renderWeek();
    });
    document.getElementById('btnWeekNext').addEventListener('click', () => {
        currentWeekOffset = Math.min(WEEK_OFFSET_MAX, currentWeekOffset + 1);
        renderWeek();
    });
    document.getElementById('btnWeekToday').addEventListener('click', () => {
        currentWeekOffset = 0;
        renderWeek();
    });

    document.getElementById('btnThemePaper').addEventListener('click', () => setTheme('paper'));
    document.getElementById('btnThemeCRT').addEventListener('click', () => setTheme('crt'));
    document.getElementById('btnThemeModern').addEventListener('click', () => setTheme('modern'));

    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('closeRoulette').addEventListener('click', closeModal);
    document.getElementById('btnRoulette').addEventListener('click', openRoulette);
    document.getElementById('btnSpin').addEventListener('click', spinRoulette);

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if(e.target === overlay) closeModal();
        });
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape') closeModal();
        if(e.key === '1') setTheme('paper');
        if(e.key === '2') setTheme('crt');
        if(e.key === '3') setTheme('modern');
        if(e.key === 'ArrowLeft') document.getElementById('btnWeekPrev').click();
        if(e.key === 'ArrowRight') document.getElementById('btnWeekNext').click();
    });
}

// Start
init();
</script>
</body>
